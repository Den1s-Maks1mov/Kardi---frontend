<div class="camera-container" [class.has-error]="aiWarningMessage !== null">
  <div class="video-wrapper">

    <video #videoElement autoplay playsinline muted class="camera-feed"></video>

    <div class="focus-frame">

      <svg class="corner top-left" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <path d="M 2 80 L 2 16 Q 2 2 16 2 L 80 2" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" />
      </svg>

      <svg class="corner top-right" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <path d="M 0 2 L 64 2 Q 78 2 78 16 L 78 80" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" />
      </svg>

      <svg class="corner bottom-left" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <path d="M 2 0 L 2 64 Q 2 78 16 78 L 80 78" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" />
      </svg>

      <svg class="corner bottom-right" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <path d="M 0 78 L 64 78 Q 78 78 78 64 L 78 0" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" />
      </svg>

    </div>
    <div class="status-badge warning" *ngIf="aiWarningMessage">
      <img src="/assets/measurement-danger.svg" alt="Danger">
      <span>{{ aiWarningMessage }}</span>
    </div>

    <div class="status-badge info" *ngIf="!aiWarningMessage">
      <img src="/assets/measurement-eye.svg" alt="Eye">
      <span>Дивіться прямо в камеру</span>
    </div>

  </div>
</div>
