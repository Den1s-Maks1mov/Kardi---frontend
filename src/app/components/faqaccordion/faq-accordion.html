<div class="faq-section">
  <h2 class="faq-title">Поширені запитання</h2>
  <p class="faq-subtitle">Залишилися запитання? У нас є відповіді.</p>

  <div class="accordion">
    <div
      class="accordion__item"
      *ngFor="let item of faqs; let i = index"
      [class.is-open]="item.isOpen"
    >

      <button class="accordion__header" (click)="toggle(i)">
        <span class="accordion__question">{{ item.question }}</span>
        <span class="accordion__icon">
          <img src="/assets/lucide_chevron-down.svg" aria-hidden="true" alt="Розгорнути">
        </span>
      </button>

      <div class="accordion__collapse">
        <div class="accordion__body-wrapper">
          <div class="accordion__body">
            <div class="accordion__content">
              {{ item.answer }}
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
