<div class="auth-page">
  <div class="auth-page__bg"></div>

  <a routerLink="/" class="auth-logo">
    <img src="/assets/kardi-logo.svg" alt="Kardi Logo">
  </a>

  <div class="auth-card reveal-section" appReveal>
    <h1 class="auth-card__title">Відновлення<br>паролю</h1>

    <p class="auth-card__subtitle">
      Згадали пароль? <a routerLink="/login" class="link">Увійти в аккаунт</a>
    </p>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="auth-form">

      <div class="form-group">
        <input
          type="email"
          formControlName="email"
          class="form-control"
          placeholder="Пошта"
          [class.is-invalid]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
        >
      </div>

      <button type="submit" class="btn btn-primary btn-submit" [disabled]="forgotPasswordForm.invalid">
        Надіслати лист з відновленням пароля
      </button>

    </form>
  </div>
</div>
