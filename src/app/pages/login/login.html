<div class="auth-page">
  <div class="auth-page__bg"></div>

  <a routerLink="/" class="auth-logo">
    <img src="/assets/kardi-logo.svg" alt="Kardi Logo">
  </a>

  <div class="auth-card reveal-section" appReveal>
    <h1 class="auth-card__title">Увійти в аккаунт</h1>

    <p class="auth-card__subtitle">
      Ще не маєте аккаунта? <a routerLink="/register" class="link">Зареєструватись</a>
    </p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">

      <div *ngIf="errorMessage" class="alert-error">
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <input
          type="text"
          formControlName="login"
          class="form-control"
          placeholder="Логін"
          [class.is-invalid]="loginForm.get('login')?.invalid && loginForm.get('login')?.touched"
        >
        <div *ngIf="loginForm.get('login')?.hasError('required') && loginForm.get('login')?.touched" class="error-text">
          Логін є обов'язковим.
        </div>
      </div>

      <div class="form-group">
        <input
          type="password"
          formControlName="password"
          class="form-control"
          placeholder="Пароль"
          [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >
        <div *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched" class="error-text">
          Введіть пароль.
        </div>

        <div *ngIf="loginForm.get('password')?.hasError('passwordStrength') && loginForm.get('password')?.touched" class="validation-hints">
          Некоректний формат пароля. Переконайтеся, що він містить великі, малі літери, цифри та має довжину від 8 символів.
        </div>
      </div>

      <div class="form-actions">
        <a routerLink="/forgot-password" class="link-forgot">Забули пароль?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-submit" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Завантаження...' : 'Увійти' }}
      </button>

    </form>
  </div>
</div>
